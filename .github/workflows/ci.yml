name: CI

# Runs the pygame_core engine's own test suite on every push/PR -- it's
# vendored as a submodule but nothing previously exercised it here.
# Deliberately separate from release.yml, which only builds/publishes on
# version tags.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: pygame_core test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with pygame_core submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install pygame_core (incl. dev group)
        working-directory: src/pygame_core
        run: uv sync --group dev

      - name: Run pytest
        working-directory: src/pygame_core
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: uv run pytest
